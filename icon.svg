<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé pour le cœur (Rouge vers Rose) -->
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
    </linearGradient>
    <!-- Filtre d'ombre portée pour le texte -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond Sombre avec bords arrondis -->
  <rect width="512" height="512" rx="120" fill="#0d0d0d"/>
  
  <!-- Bordure subtile -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="#2a2a2a" stroke-width="4"/>

  <!-- Le Cœur avec dégradé -->
  <path fill="url(#heartGradient)" d="M256 420c-6 0-12-2-17-7L85 271c-33-32-33-84 0-116 31-31 82-31 113 0l58 57 58-57c31-31 82-31 113 0 33 32 33 84 0 116L273 413c-5 5-11 7-17 7z"/>
  
  <!-- Petit reflet lumineux sur le cœur pour l'effet "Pro" -->
  <path fill="#ffffff" opacity="0.15" d="M170 190c-20 0-35 15-35 35 0 5 1 10 3 15 5-45 45-80 90-80-15-10-35-15-58-15z"/>

  <!-- Texte DANNY RT -->
  <text x="256" y="480" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#f4f4f4" text-anchor="middle" letter-spacing="6" filter="url(#dropShadow)">DANNY RT</text>
</svg>
